embedding:
  model_path: models/bge-small
  dim: 384
  device: cpu
llm:
  backend: gguf
  model_path: models/llm/model.gguf
  hf_model_path: models/llm-hf
  gpu_layers: 0
  context_length: 4096
  max_tokens: 512
  temperature: 0.2
retrieval:
  top_k: 6
  min_score: 0.25
ingest:
  chunk_chars: 1200
  chunk_overlap: 200
consolidation:
  max_turns_per_run: 200
  max_candidates_per_run: 20
training:
  base_model: models/llm-hf
  output_dir: models/adapters
  epochs: 2
  learning_rate: 0.0002
  batch_size: 1
  gradient_accumulation: 8
  max_seq_len: 1024
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  load_in_4bit: true
paths:
  db: data/mibrain.db
  faiss_index: data/index.faiss
  inbox: data/inbox
  archive: data/archive
